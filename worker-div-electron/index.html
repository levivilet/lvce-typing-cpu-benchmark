<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Worker/div Electron Editor</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; }
    #editor { position: relative; box-sizing: border-box; min-height: 100%; padding: 16px; outline: none; font: 16px/20px monospace; }
    #text { white-space: pre; }
    #cursor { position: absolute; top: 16px; left: 16px; height: 20px; width: 1px; background: black; }
  </style>
</head>
<body>
  <div id="editor" tabindex="0" role="textbox" aria-label="Editor" aria-multiline="true">
    <div id="text"></div>
    <div id="cursor"></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
